name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  backend:
    name: Backend — Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Type-check backend
        run: npm run lint --workspace=backend

      - name: Test backend
        run: npm test --workspace=backend
        env:
          NODE_ENV: test
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          JWT_SECRET: ci-test-secret-at-least-32-chars-long!!
          R2_ACCOUNT_ID: placeholder-r2-account
          R2_ACCESS_KEY_ID: placeholder-r2-key-id
          R2_SECRET_ACCESS_KEY: placeholder-r2-secret
          R2_BUCKET: placeholder-bucket
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_PRO_PRICE_ID: price_placeholder
          FLW_PUBLIC_KEY: FLWPUBK_TEST-placeholder
          FLW_SECRET_KEY: FLWSECK_TEST-placeholder
          FLW_WEBHOOK_HASH: placeholder-flw-hash
          APP_URL: http://localhost:5173
          CORS_ORIGINS: http://localhost:5173
